# Local development database only. Production deployment lives in a separate project.
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: crawl
      POSTGRES_PASSWORD: crawl
      POSTGRES_DB: crawl
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
